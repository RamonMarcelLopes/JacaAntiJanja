# Jaca anti Janja room server. The name MUST stay "jaca-sala": the app derives the address
# https://jaca-sala.<your-workers-subdomain>.workers.dev from it.
name = "jaca-sala"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The room address is https://jaca-sala.<account>.workers.dev, so the workers.dev route must be ON (stated here instead of relying on the default,
# which the dashboard once showed as "Desabilitado"). Preview URLs are not needed.
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "OWNER"
class_name = "Owner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Owner"]
